<div class="metric" data-filter="BUY"
     onclick="setFilter('BUY',this)">
  BUY / SPOT ENTRY
  <strong class="good" id="cBuy">0</strong>
</div>

<div class="metric" data-filter="SELL"
     onclick="setFilter('SELL',this)">
  SELL / EXIT
  <strong class="bad" id="cSell">0</strong>
</div>

<div class="metric" data-filter="LONG"
     onclick="setFilter('LONG',this)">
  FUTURES LONG
  <strong class="good" id="cLong">0</strong>
</div>

<div class="metric" data-filter="SHORT"
     onclick="setFilter('SHORT',this)">
  FUTURES SHORT
  <strong class="bad" id="cShort">0</strong>
</div>
