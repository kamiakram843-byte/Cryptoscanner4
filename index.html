<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>QuantPulse | Advance Signal & Trading Terminal</title>
    <script src="https://unpkg.com"></script>
    <style>
        :root {
            --bg-primary: #0b0e14;
            --bg-secondary: #151a23;
            --bg-tertiary: #1e2532;
            --text-primary: #e2e8f0;
            --text-secondary: #94a3b8;
            --accent-blue: #3b82f6;
            --bull-green: #10b981;
            --bear-red: #ef4444;
            --warn-amber: #f59e0b;
            --border-color: #2a3241;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background-color: var(--bg-primary);
            color: var(--text-primary);
            display: flex;
            flex-direction: column;
            height: 100vh;
            overflow: hidden;
        }

        /* Header */
        header {
            background-color: var(--bg-secondary);
            border-bottom: 1px solid var(--border-color);
            padding: 12px 24px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .logo {
            font-size: 1.2rem;
            font-weight: 700;
            letter-spacing: 0.5px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .logo span {
            color: var(--accent-blue);
        }

        .controls {
            display: flex;
            gap: 12px;
            align-items: center;
        }

        select, button {
            background-color: var(--bg-tertiary);
            color: var(--text-primary);
            border: 1px solid var(--border-color);
            padding: 8px 14px;
            border-radius: 6px;
            font-size: 0.9rem;
            cursor: pointer;
            outline: none;
            transition: border-color 0.2s;
        }

        select:hover, button:hover {
            border-color: var(--accent-blue);
        }

        .live-badge {
            display: flex;
            align-items: center;
            gap: 6px;
            font-size: 0.85rem;
            color: var(--bull-green);
            background: rgba(16, 185, 129, 0.1);
            padding: 6px 12px;
            border-radius: 20px;
            border: 1px solid rgba(16, 185, 129, 0.3);
        }

        .pulse-dot {
            width: 8px;
            height: 8px;
            background-color: var(--bull-green);
            border-radius: 50%;
            animation: pulse 1.5s infinite;
        }

        @keyframes pulse {
            0% { transform: scale(0.95); box-shadow: 0 0 0 0 rgba(16, 185, 129, 0.7); }
            70% { transform: scale(1); box-shadow: 0 0 0 6px rgba(16, 185, 129, 0); }
            100% { transform: scale(0.95); box-shadow: 0 0 0 0 rgba(16, 185, 129, 0); }
        }

        /* Main Layout */
        .main-container {
            display: grid;
            grid-template-columns: 1fr 380px;
            flex: 1;
            overflow: hidden;
        }

        /* Chart Section */
        .chart-section {
            display: flex;
            flex-direction: column;
            border-right: 1px solid var(--border-color);
            position: relative;
        }

        .price-ticker {
            padding: 12px 24px;
            background-color: var(--bg-primary);
            border-bottom: 1px solid var(--border-color);
            display: flex;
            gap: 32px;
            align-items: baseline;
        }

        .current-price {
            font-size: 1.8rem;
            font-weight: 700;
            font-variant-numeric: tabular-nums;
        }

        .stat-group {
            display: flex;
            flex-direction: column;
        }

        .stat-label {
            font-size: 0.75rem;
            color: var(--text-secondary);
            text-transform: uppercase;
        }

        .stat-val {
            font-size: 0.95rem;
            font-weight: 600;
            font-variant-numeric: tabular-nums;
        }

        #chart-container {
            flex: 1;
            width: 100%;
        }

        /* Signal Sidebar */
        .sidebar {
            background-color: var(--bg-secondary);
            display: flex;
            flex-direction: column;
            overflow-y: auto;
            padding: 20px;
            gap: 20px;
        }

        .card {
            background-color: var(--bg-tertiary);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            padding: 16px;
        }

        .card-title {
            font-size: 0.85rem;
            text-transform: uppercase;
            letter-spacing: 0.8px;
            color: var(--text-secondary);
            margin-bottom: 12px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        /* Advance Signal Box */
        .signal-box {
            text-align: center;
            padding: 20px 16px;
            border-radius: 8px;
            border: 1px solid var(--border-color);
            background: var(--bg-primary);
        }

        .signal-status {
            font-size: 1.4rem;
            font-weight: 800;
            margin-bottom: 6px;
            letter-spacing: 0.5px;
        }

        .signal-desc {
            font-size: 0.85rem;
            color: var(--text-secondary);
            line-height: 1.4;
        }

        .bullish { color: var(--bull-green); }
        .bearish { color: var(--bear-red); }
        .neutral { color: var(--warn-amber); }

        /* Metrics Grid */
        .metric-row {
            display: flex;
            justify-content: space-between;
            padding: 8px 0;
            border-bottom: 1px solid rgba(255,255,255,0.05);
            font-size: 0.9rem;
        }

        .metric-row:last-child {
            border-bottom: none;
        }

        /* Trade Setup Levels */
        .level-box {
            display: grid;
            grid-template-columns: 1fr 1fr 1fr;
            gap: 8px;
            margin-top: 10px;
        }

        .level-item {
            background: var(--bg-primary);
            padding: 10px;
            border-radius: 6px;
            text-align: center;
        }

        .level-item span {
            display: block;
            font-size: 0.75rem;
            color: var(--text-secondary);
            margin-bottom: 4px;
        }

        .level-item strong {
            font-size: 0.9rem;
            font-variant-numeric: tabular-nums;
        }

        /* Signal Log */
        .log-list {
            display: flex;
            flex-direction: column;
            gap: 8px;
            max-height: 220px;
            overflow-y: auto;
        }

        .log-item {
            background: var(--bg-primary);
            padding: 10px;
            border-radius: 6px;
            font-size: 0.82rem;
            border-left: 3px solid var(--accent-blue);
        }

        .log-item.buy { border-left-color: var(--bull-green); }
        .log-item.sell { border-left-color: var(--bear-red); }
        .log-item.squeeze { border-left-color: var(--warn-amber); }

        .log-time {
            color: var(--text-secondary);
            font-size: 0.75rem;
            margin-bottom: 2px;
        }

        .disclaimer {
            font-size: 0.72rem;
            color: var(--text-secondary);
            line-height: 1.4;
            margin-top: auto;
            padding-top: 12px;
            border-top: 1px solid var(--border-color);
        }
    </style>
</head>
<body>

<header>
    <div class="logo">⚡ Quant<span>Pulse</span> Pro</div>
    <div class="controls">
        <select id="symbol-select">
            <option value="BTCUSDT">BTC / USDT</option>
            <option value="ETHUSDT">ETH / USDT</option>
            <option value="SOLUSDT">SOL / USDT</option>
            <option value="XRPUSDT">XRP / USDT</option>
            <option value="BNBUSDT">BNB / USDT</option>
        </select>
        <select id="timeframe-select">
            <option value="1m">1m (Scalping)</option>
            <option value="5m">5m (Intraday)</option>
            <option value="15m" selected>15m (Swing Setup)</option>
            <option value="1h">1h (Trend)</option>
            <option value="4h">4h (Macro)</option>
        </select>
        <div class="live-badge">
            <div class="pulse-dot"></div>
            <span>LIVE FEED</span>
        </div>
    </div>
</header>

<div class="main-container">
    <div class="chart-section">
        <div class="price-ticker">
            <div class="current-price" id="live-price">Loading...</div>
            <div class="stat-group">
                <span class="stat-label">Projected Next Close</span>
                <span class="stat-val" id="projected-price">--</span>
            </div>
            <div class="stat-group">
                <span class="stat-label">Volatility Regime</span>
                <span class="stat-val" id="volatility-state">--</span>
            </div>
            <div class="stat-group">
                <span class="stat-label">Leading Momentum</span>
                <span class="stat-val" id="momentum-state">--</span>
            </div>
        </div>
        <div id="chart-container"></div>
    </div>

    <div class="sidebar">
        <!-- Primary Advance Signal -->
        <div class="card">
            <div class="card-title">
                <span>Advance Signal Engine</span>
                <span id="confidence-score">Confidence: --%</span>
            </div>
            <div class="signal-box" id="signal-box">
